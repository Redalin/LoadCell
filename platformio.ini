; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Only build/upload the real-hardware env by default.
; The wokwi env must be invoked explicitly with `-e wokwi` and refuses uploads.
default_envs = esp32dev

# Simplified build for Wokwi preview (no WiFi/ESP-NOW/HX711/LittleFS).
# Builds only src/main_wokwi.cpp. Used by wokwi.toml.
# Upload to real hardware is blocked by scripts/block_wokwi_upload.py.
[env:wokwi]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
build_src_filter = -<*> +<main_wokwi.cpp>
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.16
extra_scripts = pre:scripts/block_wokwi_upload.py

[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
build_src_filter = +<*> -<main_wokwi.cpp>
lib_deps =
	bogde/HX711@^0.7.5
	esp32async/ESPAsyncWebServer@^3.9.6
	esp32async/AsyncTCP@^3.4.10
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit SSD1306@^2.5.16
	ayushsharma82/ElegantOTA@^3.1.7
extra_scripts = pre:scripts/compress_littlefs.py

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
build_src_filter = +<*> -<main_wokwi.cpp>
lib_deps =
	bogde/HX711@^0.7.5
	esp32async/ESPAsyncWebServer@^3.9.6
	esp32async/AsyncTCP@^3.4.10
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit SSD1306@^2.5.16
	ayushsharma82/ElegantOTA@^3.1.7
extra_scripts = pre:scripts/compress_littlefs.py